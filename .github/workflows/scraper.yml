name: WoW Inven Scraper

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 모든 이력을 가져와 안전하게 pull/rebase가 가능하도록 설정

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 필요 라이브러리 설치
        run: |
          pip install requests beautifulsoup4

      - name: 크롤러 스크립트 실행
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scraper.py
        continue-on-error: true

      - name: 변경된 상태 파일 저장 (커밋 & 푸시)
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # 변경된 상태 파일 스테이징
          git add -f last_id.txt fail_count.txt 2>/dev/null || true
          
          # 변경 사항이 있을 때만 커밋 및 동기화 후 푸시
          if ! git diff --staged --quiet; then
            git commit -m "Update state"
            git pull --rebase origin main
            git push
          else
            echo "변경 사항이 없어 커밋하지 않습니다."
          fi
