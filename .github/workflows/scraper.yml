name: WoW Inven Scraper

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: 테스트 메일만 발송 (실제 수집 없음)
        type: boolean
        default: false
  push:
    paths:
      - scraper.py
      - test_scraper.py
      - save_state.sh
      - .github/workflows/scraper.yml

permissions:
  contents: write

concurrency:
  group: wow-inven-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: 필요 라이브러리 설치
        run: python -m pip install requests beautifulsoup4

      - name: 회귀 테스트
        run: python -m unittest -v

      - name: 배포 후 접속 및 파싱 점검
        if: github.event_name == 'push'
        run: python -u scraper.py --dry-run

      - name: 크롤러 스크립트 실행
        id: scraper
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' && !inputs.test_email
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -u scraper.py

      - name: 테스트 메일 발송
        if: github.event_name == 'workflow_dispatch' && inputs.test_email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python -u -c "import scraper; scraper.send_fail_email(3, '[테스트] 인벤 접속 실패: 모의 오류')" | tee /tmp/scraper-mail-test.log
          grep -q '실패 알림 메일 전송 완료' /tmp/scraper-mail-test.log

      - name: 스크래퍼 실패 기록
        if: always() && steps.scraper.outcome == 'failure'
        run: |
          echo '::warning::스크래퍼 실행 실패. 상세 로그와 연속 실패 횟수를 확인하세요.'
          echo '### 스크래퍼 실행 실패' >> "$GITHUB_STEP_SUMMARY"
          echo '상세 원인은 스크래퍼 실행 로그에 기록됩니다. 연속 3회 실패하면 상세 메일을 발송합니다.' >> "$GITHUB_STEP_SUMMARY"

      - name: 변경된 상태 파일 저장 (커밋 & 푸시)
        if: always() && github.event_name == 'workflow_dispatch' && !inputs.test_email
        run: bash save_state.sh last_id.txt fail_count.txt
