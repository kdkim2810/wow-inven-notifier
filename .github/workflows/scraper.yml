name: WoW Inven Scraper

on:
  workflow_dispatch:
  push:
    paths:
      - scraper.py
      - test_scraper.py
      - .github/workflows/scraper.yml

permissions:
  contents: write

concurrency:
  group: wow-inven-scraper
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'

      - name: 필요 라이브러리 설치
        run: python -m pip install requests beautifulsoup4

      - name: 회귀 테스트
        run: python -m unittest -v

      - name: 배포 후 접속 및 파싱 점검
        if: github.event_name == 'push'
        run: python scraper.py --dry-run

      - name: 크롤러 스크립트 실행
        if: github.event_name == 'workflow_dispatch'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scraper.py

      - name: 변경된 상태 파일 저장 (커밋 & 푸시)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add last_id.txt fail_count.txt
          if ! git diff --staged --quiet; then
            git commit -m "Update state"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "변경 사항이 없어 커밋하지 않습니다."
          fi
