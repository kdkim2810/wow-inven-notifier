name: Deploy Inven Auto OAuth information site
on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/inven-auto-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
